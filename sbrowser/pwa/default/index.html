<script>
  window.postMessage({
      source:"PWA",
    type:"sendMessage",
    message: { action:"enableSecurity"}
  },"*" );
  window.postMessage({
        source: "PWA",
        type: "sendMessage",
        message: { action: "disableSecurity" }
    }, "*");
  document.write(localStorage.getItem("networkName")||"").trim());
</script>
